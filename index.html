<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task-Based Goals - Accomplishments, Not Vibes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f1;--card:#fdfdfb;--line:#dcdfd6;--line2:#c5cab9;--ink:#1e2620;--dim:#6d7a6c;--faint:#a2ab9c;--green:#2e7d4f;--green-deep:#1e5c39}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:38px 16px 56px}
.wrap{width:min(620px,95vw)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
h1 span{color:var(--green)}
.sub{color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;margin-top:6px}
#stats{display:flex;gap:8px;margin:16px 0}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 13px}
.stat .k{font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint)}
.stat .v{font-weight:800;font-size:20px;margin-top:2px;color:var(--green-deep);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;margin-top:8px}
input{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:inherit;font-size:14px;padding:12px 13px;flex:1;outline:none;transition:border-color .15s}
input:focus{border-color:var(--green)}
input::placeholder{color:var(--faint)}
button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px 15px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;transition:border-color .15s,color .15s}
button:hover{border-color:var(--green);color:var(--green)}
#addgoal{background:var(--green);border-color:var(--green);color:#fff}
#addgoal:hover{color:#fff;background:var(--green-deep)}
#goals{margin-top:16px;display:grid;gap:10px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 1px 0 rgba(30,38,32,.04)}
.goal .g{font-size:15.5px;font-weight:700}
.goal .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.goal .pct{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--faint);letter-spacing:1px}
.goal .pct.done{color:var(--green);font-weight:600}
.goal .bar{height:5px;background:#e7e9e2;border-radius:3px;margin:10px 0 4px;overflow:hidden}
.goal .fill{height:100%;background:var(--green);transition:width .3s}
.goal .tasks{display:grid;gap:2px;margin-top:8px}
.taskline{font-size:13.5px;display:flex;gap:10px;align-items:center;color:var(--ink);padding:5px 0;border-bottom:1px dashed #e7e9e2}
.taskline:last-child{border-bottom:none}
.taskline.done{color:var(--faint)}
.taskline.done .txt{text-decoration:line-through}
.taskline .txt{flex:1}
.box{width:19px;height:19px;border:1.5px solid var(--line2);border-radius:5px;background:var(--card);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s}
.box:hover{border-color:var(--green)}
.taskline.done .box{background:var(--green);border-color:var(--green)}
.box svg{opacity:0;transition:opacity .1s}
.taskline.done .box svg{opacity:1}
footer{margin-top:26px;color:var(--faint);font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;text-align:center}
@media(max-width:600px){#stats{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Task-Based <span>Goals</span></h1>
    <div class="sub">A goal is just tasks in a trench coat</div>
  </div>
</header>
<div id="stats"></div>
<div class="row"><input id="goal" placeholder="goal (e.g. run a 5k)" maxlength="60"></div>
<div class="row"><input id="task" placeholder="add a task to the newest goal" maxlength="60"><button id="addtask">Add task</button><button id="addgoal">New goal</button></div>
<div id="goals"></div>
<footer>accomplishments, not vibes</footer>
</div>
<script>
const $=id=>document.getElementById(id);
let goals=JSON.parse(localStorage.getItem('taskgoals')||'[]');
function save(){localStorage.setItem('taskgoals',JSON.stringify(goals));}
const CHECK='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 10 18 20 6"/></svg>';
function render(){
 const done=goals.filter(g=>g.tasks.length&&g.tasks.every(t=>t.done)).length;
 const allTasks=goals.flatMap(g=>g.tasks);
 $('stats').innerHTML='<div class="stat"><div class="k">Goals</div><div class="v">'+goals.length+'</div></div><div class="stat"><div class="k">Accomplished</div><div class="v">'+done+'</div></div><div class="stat"><div class="k">Tasks done</div><div class="v">'+allTasks.filter(t=>t.done).length+'/'+allTasks.length+'</div></div>';
 const el=$('goals');el.innerHTML='';
 goals.forEach((g,gi)=>{
  const d=document.createElement('div');d.className='goal';
  const pct=g.tasks.length?Math.round(100*g.tasks.filter(t=>t.done).length/g.tasks.length):0;
  d.innerHTML='<div class="head"><div class="g">'+g.name.replace(/</g,'&lt;')+'</div><div class="pct'+(pct===100&&g.tasks.length?' done':'')+'">'+pct+'%'+(pct===100&&g.tasks.length?' &middot; ACCOMPLISHED':'')+'</div></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>';
  const tl=document.createElement('div');tl.className='tasks';
  g.tasks.forEach((t,ti)=>{
   const l=document.createElement('div');l.className='taskline'+(t.done?' done':'');
   const bx=document.createElement('button');bx.className='box';bx.innerHTML=CHECK;bx.setAttribute('aria-label','toggle done');
   bx.onclick=()=>{t.done=!t.done;save();render();};
   const sp=document.createElement('span');sp.className='txt';sp.textContent=t.text;
   l.appendChild(bx);l.appendChild(sp);tl.appendChild(l);});
  d.appendChild(tl);el.appendChild(d);});
}
$('addgoal').onclick=()=>{const t=$('goal').value.trim();if(!t)return;goals.unshift({name:t,tasks:[]});$('goal').value='';save();render();};
$('addtask').onclick=()=>{const t=$('task').value.trim();if(!t||!goals.length)return;goals[0].tasks.push({text:t,done:false});$('task').value='';save();render();};
$('goal').addEventListener('keydown',e=>{if(e.key==='Enter')$('addgoal').click();});
$('task').addEventListener('keydown',e=>{if(e.key==='Enter')$('addtask').click();});
if(!goals.length)goals=[{name:'Example: run a 5k',tasks:[{text:'Buy shoes',done:true},{text:'Run 1k without stopping',done:false},{text:'Sign up for a race',done:false}]}];
render();
</script>
</body>
</html>
